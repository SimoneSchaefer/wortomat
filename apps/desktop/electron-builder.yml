# Builds installers for Windows, macOS and Linux: `npm run dist` (in the repo root). Each platform
# is best built on its own OS (e.g. via GitHub Actions).
appId: de.wortomat.app
productName: Wortomat
copyright: Copyright © 2026 Wortomat

directories:
  app: app
  output: release
  buildResources: build   # icon.png (1024×1024), rendered from icon.svg

files:
  - "**/*"

asar: true

fileAssociations:
  - ext: wortomat
    name: Wortomat-Projekt
    description: Wortomat-Projekt
    role: Editor

win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  # Apple Silicon only; Intel Macs would need x64 (or universal) as well.
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity

linux:
  # Ready-made sizes up to 512 px: the hicolor theme has no 1024 folder, and with only icon.png the
  # icon lands there alone – GNOME then does not find it.
  icon: build/icons
  target: [AppImage, deb]
  category: Office
  syncDesktopName: true
  synopsis: Software zum Schreiben von Büchern und Romanen
