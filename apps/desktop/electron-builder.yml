# Erzeugt Installer für Windows, macOS und Linux: `npm run dist` (im Repo-Root).
# Jede Plattform baut man am besten auf ihrem eigenen Betriebssystem (z. B. per GitHub Actions).
appId: de.wortomat.app
productName: Wortomat
copyright: Copyright © 2026 Wortomat

directories:
  app: app
  output: release
  buildResources: build   # icon.png (1024×1024), gerendert aus icon.svg

files:
  - "**/*"

asar: true

fileAssociations:
  - ext: wortomat
    name: Wortomat-Projekt
    description: Wortomat-Projekt
    role: Editor

win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  # Nur Apple Silicon; Intel-Macs bräuchten zusätzlich x64 (bzw. universal).
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity

linux:
  # Fertige Größen bis 512 px: das hicolor-Theme kennt keinen 1024er-Ordner, und nur mit
  # icon.png landet das Icon allein dort – GNOME findet es dann nicht.
  icon: build/icons
  target: [AppImage, deb]
  category: Office
  syncDesktopName: true
  synopsis: Software zum Schreiben von Büchern und Romanen
