<main class="settings">
  <header>
    <button type="button" class="link back" (click)="back()">{{ t().common.back }}</button>
    <h1>{{ t().settings.title }}</h1>
  </header>

  <section class="card">
    <fieldset>
      <legend>
        <h2>{{ t().settings.language }}</h2>
      </legend>
      <p class="muted hint">{{ t().settings.languageHint }}</p>
      <div class="choices">
        @for (option of languages; track option.language) {
          <label class="choice" [class.selected]="i18n.language() === option.language">
            <input
              type="radio"
              name="language"
              [value]="option.language"
              [checked]="i18n.language() === option.language"
              (change)="chooseLanguage(option.language)"
            />
            <span class="language-name" [attr.lang]="option.language">{{ option.name }}</span>
          </label>
        }
      </div>
    </fieldset>
  </section>

  <section class="card">
    <fieldset>
      <legend>
        <h2>{{ t().settings.quotes }}</h2>
      </legend>
      <p class="muted hint">{{ t().settings.quotesHint }}</p>
      <div class="choices">
        @for (info of quoteStyles; track info.style) {
          <label class="choice" [class.selected]="settings.settings().quoteStyle === info.style">
            <input
              type="radio"
              name="quoteStyle"
              [value]="info.style"
              [checked]="settings.settings().quoteStyle === info.style"
              (change)="chooseQuoteStyle(info.style)"
            />
            <span class="choice-label">{{ t().settings.quoteStyles[info.style] }}</span>
            <span class="example">{{ example(info) }}</span>
          </label>
        }
      </div>
    </fieldset>
  </section>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
</main>
