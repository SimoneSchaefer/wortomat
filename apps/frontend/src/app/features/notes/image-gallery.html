<div
  class="gallery"
  role="region"
  [attr.aria-roledescription]="t().gallery.roleDescription"
  [attr.aria-label]="label()"
  [class.drop-active]="dropActive()"
  [attr.tabindex]="images().length > 1 ? 0 : null"
  (keydown)="onKeydown($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="dropActive.set(false)"
  (drop)="onDrop($event)"
>
  @if (images().length) {
    <div
      #track
      class="track"
      [class.dragging]="dragging()"
      (scroll)="onScroll()"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
    >
      @for (image of images(); track image.id; let i = $index) {
        <figure class="slide" [attr.aria-hidden]="i !== index()">
          <img
            [src]="image.url"
            [alt]="t().gallery.imageAlt(label(), i + 1, images().length)"
            draggable="false"
          />
        </figure>
      }
    </div>

    @if (images().length > 1) {
      <button
        type="button"
        class="nav prev"
        [attr.aria-label]="t().gallery.previous"
        [disabled]="index() === 0"
        (click)="goTo(index() - 1)"
      >
        ‹
      </button>
      <button
        type="button"
        class="nav next"
        [attr.aria-label]="t().gallery.next"
        [disabled]="index() === images().length - 1"
        (click)="goTo(index() + 1)"
      >
        ›
      </button>
      <div class="dots">
        @for (image of images(); track image.id; let i = $index) {
          <button
            type="button"
            [class.active]="i === index()"
            [attr.aria-label]="t().gallery.image(i + 1)"
            (click)="goTo(i)"
          ></button>
        }
      </div>
    }

    <div class="toolbar">
      @if (index() === 0) {
        <span class="badge">{{ label() }}</span>
      } @else {
        <button type="button" [disabled]="busy()" (click)="makeCover()">
          {{ t().gallery.makeCover(label()) }}
        </button>
      }
      <span class="spacer"></span>
      <!-- Symbole als SVG: Textzeichen wie + und × sitzen je nach Schrift nicht mittig -->
      <button
        type="button"
        class="icon"
        [title]="t().gallery.add"
        [attr.aria-label]="t().gallery.add"
        [disabled]="busy()"
        (click)="picker.click()"
      >
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" /></svg>
      </button>
      <button
        type="button"
        class="icon"
        [title]="t().gallery.remove"
        [attr.aria-label]="t().gallery.remove"
        [disabled]="busy()"
        (click)="removeCurrent()"
      >
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
      </button>
    </div>
  } @else if (!loading()) {
    <button type="button" class="empty" [disabled]="busy()" (click)="picker.click()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @if (placeholderIcon() === 'person') {
          <circle cx="12" cy="8.5" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        } @else {
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <circle cx="9" cy="9.5" r="1.8" />
          <path d="M3.5 18.5l5.5-5.5 4 4 2.5-2.5 5 5" />
        }
      </svg>
      <span>{{ busy() ? t().gallery.uploading : t().gallery.addFirst(label()) }}</span>
      <small>{{ t().gallery.dropHint }}</small>
    </button>
  }

  <input
    #picker
    type="file"
    accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
    multiple
    hidden
    (change)="onPicked(picker)"
  />
</div>
