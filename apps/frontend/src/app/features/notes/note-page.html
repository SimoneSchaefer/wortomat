@if (note()) {
  <wm-document-editor
    [documentId]="id()"
    [source]="source"
    [template]="config().template"
    [placeholder]="config().textPlaceholder"
  >
    <div class="note-head" [class.with-gallery]="config().gallery">
      <div class="note-meta">
        <p class="doc-kind">{{ config().singular }}</p>
        <input
          #titleInput
          class="doc-title doc-input"
          aria-label="Titel"
          [value]="titleDraft()"
          (input)="onTitleInput($any($event.target).value)"
          (blur)="onTitleBlur()"
          (keydown.enter)="summaryInput.focus()"
        />
        <input
          #summaryInput
          class="doc-summary doc-input"
          aria-label="Kurzbeschreibung"
          [placeholder]="config().summaryPlaceholder"
          [value]="summaryDraft()"
          (input)="onSummaryInput($any($event.target).value)"
        />
      </div>
      @if (config().gallery) {
        <wm-image-gallery [noteId]="id()" label="Profilbild" (changed)="onGalleryChanged($event)" />
      }
    </div>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
  </wm-document-editor>
} @else {
  <p class="muted not-found">Dieser Eintrag existiert nicht mehr.</p>
}
