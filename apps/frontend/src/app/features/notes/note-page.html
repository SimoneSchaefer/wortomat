@if (note()) {
  <wm-document-editor
    [documentId]="id()"
    [source]="source"
    [template]="template()"
    [placeholder]="texts().textPlaceholder"
  >
    <div class="note-head" [class.with-gallery]="config().gallery">
      <div class="note-meta">
        <p class="doc-kind">{{ texts().singular }}</p>
        <!--
          Title and summary are multi-line: they grow with the text (field-sizing) so long names are
          not cut off
        -->
        <textarea
          #titleInput
          class="doc-title doc-input"
          rows="1"
          [attr.aria-label]="t().common.title"
          [value]="titleDraft()"
          (input)="onTitleInput($any($event.target))"
          (blur)="onTitleBlur()"
          (keydown.enter)="$event.preventDefault(); summaryInput.focus()"
        ></textarea>
        <textarea
          #summaryInput
          class="doc-summary doc-input"
          rows="1"
          [attr.maxlength]="maxSummaryLength"
          [attr.aria-label]="t().notes.summary"
          [placeholder]="texts().summaryPlaceholder"
          [value]="summaryDraft()"
          (input)="onSummaryInput($any($event.target).value)"
        ></textarea>
        <wm-note-group-picker [noteId]="id()" [kind]="kind()" />
        @if (config().linkable) {
          <wm-note-appearances [noteId]="id()" />
        }
      </div>
      @if (config().gallery) {
        <div class="side">
          <wm-image-gallery
            [noteId]="id()"
            [label]="t().notes.profileImage"
            [placeholderIcon]="config().galleryIcon"
            (changed)="onGalleryChanged($event)"
          />
          @if (config().mappable) {
            <wm-note-location [noteId]="id()" />
          }
        </div>
      }
    </div>
  </wm-document-editor>
} @else {
  <p class="muted not-found">{{ t().notes.notFound }}</p>
}
