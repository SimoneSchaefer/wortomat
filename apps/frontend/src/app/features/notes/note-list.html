<nav [attr.aria-label]="texts().label">
  <ul>
    @for (note of notes(); track note.id) {
      <li>
        <a
          [routerLink]="['/write', config().path, note.id]"
          routerLinkActive="active"
          [class.with-avatar]="config().gallery"
        >
          @if (config().gallery) {
            <wm-note-avatar [note]="note" />
          }
          <span class="text">
            <span class="title" [title]="note.title">{{ note.title }}</span>
            @if (note.summary) {
              <span class="summary">{{ note.summary }}</span>
            }
          </span>
        </a>
        <button type="button" class="remove" [title]="t().common.delete" (click)="remove(note)">
          ×
        </button>
      </li>
    } @empty {
      <li class="muted empty">{{ texts().emptyList }}</li>
    }
  </ul>

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
</nav>
