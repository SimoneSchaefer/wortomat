<div class="layout" [style.--sidebar-width.px]="sidebarWidth()">
  <!-- Obere Leiste: alles, was das ganze Buch betrifft -->
  <header class="topbar">
    <div class="book" [title]="store.project()?.filePath ?? ''">
      <span class="book-title">{{ store.project()?.title }}</span>
      <span class="muted">{{ store.totalWords() | number }} Wörter</span>
    </div>
    <wm-global-search />
    <div class="top-actions">
      <button type="button" class="link" (click)="exportDialog.open()">Exportieren …</button>
      <button type="button" class="link" (click)="closeProject()">Projekt schließen</button>
    </div>
  </header>

  <nav class="rail" aria-label="Bereiche">
    @for (item of menu; track item.section) {
      <button
        type="button"
        [class.active]="section() === item.section"
        [attr.aria-current]="section() === item.section ? 'page' : null"
        (click)="openSection(item)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @switch (item.section) {
            @case ('manuscript') {
              <path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6.5a2.5 2.5 0 0 0 0 5H20" />
              <path d="M9 7h7M9 11h5" />
            }
            @case ('character') {
              <circle cx="9" cy="8" r="3.5" />
              <path d="M2.5 20a6.5 6.5 0 0 1 13 0" />
              <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5a6.5 6.5 0 0 1 3 5.5" />
            }
            @case ('place') {
              <path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" />
              <circle cx="12" cy="9.5" r="2.5" />
            }
            @case ('research') {
              <path
                d="M9 3h6M10 3v6.5L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9.5V3"
              />
              <path d="M7.5 15h9" />
            }
          }
        </svg>
        <span>{{ item.label }}</span>
      </button>
    }
  </nav>

  <aside class="sidebar" [attr.aria-label]="sectionLabel()">
    <h2>{{ sectionLabel() }}</h2>

    @if (noteKind(); as kind) {
      <wm-note-list [kind]="kind" />
    } @else {
      <wm-manuscript-tree />
    }

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <wm-resize-handle
      label="Breite der Seitenleiste"
      [value]="sidebarWidth()"
      [min]="minSidebarWidth"
      [max]="maxSidebarWidth()"
      (resized)="settings.setSidebarWidth($event)"
      (reset)="settings.setSidebarWidth(null)"
    />
  </aside>

  <main class="content">
    @if (notes.loaded()) {
      <router-outlet />
    }
  </main>
</div>

<wm-export-dialog #exportDialog />
