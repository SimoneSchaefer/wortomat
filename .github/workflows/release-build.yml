# Shared by the three release workflows: builds the app in release mode on the matching OS and
# uploads the installers as an artifact.
name: Release-Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-Runner, z. B. ubuntu-latest
        type: string
        required: true
      platform:
        description: Plattform-Schalter für electron-builder (--linux, --win, --mac)
        type: string
        required: true
      artifact:
        description: Name des Artefakts
        type: string
        required: true
      files:
        description: Installer, die hochgeladen werden (Glob-Muster, eines pro Zeile)
        type: string
        required: true

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write # pushes the release tag
    env:
      # Without a certificate, do not sign instead of searching the keychain for one.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
        with:
          # All tags and main's history: the release number is a tag (apps/desktop/scripts/version.mjs)
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Takes the number of this commit, or gives it the next one and pushes the tag
      - id: version
        shell: bash
        run: echo "version=$(node apps/desktop/scripts/version.mjs --assign)" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm run dist -w @wortomat/desktop -- ${{ inputs.platform }} --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact }}-${{ steps.version.outputs.version }}
          path: ${{ inputs.files }}
          if-no-files-found: error
