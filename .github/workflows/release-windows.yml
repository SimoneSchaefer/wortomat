# Start manually: Actions → "Release Windows" → "Run workflow".
name: Release Windows

on:
  workflow_dispatch:

jobs:
  build:
    # The shared build pushes the release tag
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      runner: windows-latest
      platform: --win
      artifact: wortomat-windows
      files: apps/desktop/release/*.exe
