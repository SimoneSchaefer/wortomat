name: CI

on:
  push:
  pull_request:

# Build and tests only read the code; keeps the token read-only even if the repo default is write.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only backend and frontend: the tests run the built frontend against the real backend.
      - run: npm run build -w @wortomat/backend && npm run build -w @wortomat/frontend
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
